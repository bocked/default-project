name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build client and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build static export
        working-directory: client
        run: npm run build
        env:
          NEXT_PUBLIC_SERVER_URL: https://yerlikoglon-backend.onrender.com
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 979dbdeb9428a8828dfc3c6520fc1713
          workingDirectory: client
          # Pin a known-good version instead of "latest" (wrangler@4.121.0
          # resolved to a broken miniflare@5...alpha on the registry).
          wranglerVersion: "4.120.1"
          command: pages deploy out --project-name=default-project --branch=main
