# Canvas backend — api.yerlikoglon.uz
# Pre-certbot config: run `certbot --nginx -d api.yerlikoglon.uz --redirect`
# afterwards to add HTTPS (certbot appends the 443 block itself).
server {
    listen 80;
    listen [::]:80;

    server_name api.yerlikoglon.uz;

    # Image uploads (R2 not configured -> stored on disk, served here)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Socket.io needs Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-polling / SSE friendly
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
