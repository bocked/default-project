# Render Blueprint for the canvas backend.
# Optional: import this file in the Render dashboard to (re)create the service
# with migrations run before each deploy.
services:
  - type: web
    name: yerlikoglon-backend
    runtime: node
    plan: free
    rootDir: server
    # NODE_ENV=production is inherited from Render; install devDeps explicitly
    # so tsc (which compiles tests) resolves @types + vitest, then run migrations.
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://default-project-bza.pages.dev,https://*.pages.dev,https://yerlikoglon.uz,https://www.yerlikoglon.uz,http://localhost:3000"
      - key: PUBLIC_BASE_URL
        value: "https://yerlikoglon-backend.onrender.com"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: uploads
      - key: R2_PUBLIC_URL
        sync: false
