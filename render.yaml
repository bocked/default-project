# Render Blueprint for the backend.
# Optional: import this file in the Render dashboard to (re)create the service
# with migrations run before each deploy.
services:
  - type: web
    name: yerlikoglon-backend
    runtime: node
    plan: free
    rootDir: server
    # NODE_ENV=production is inherited from Render; install devDeps explicitly
    # so tsc (which compiles tests) resolves @types + vitest, then run migrations.
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://default-project-bza.pages.dev,https://*.pages.dev,https://yerlikoglon.uz,https://www.yerlikoglon.uz,http://localhost:3000"
      - key: SENTRY_DSN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        value: "https://default-project-bza.pages.dev"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
